<!DOCTYPE html>
<html>
<head>
<title>Rush Neuron to Text or YDKE</title>
</head>
<body>

<script src='updater.js'></script>
<h1>Rush Neuron to Text or YDKE</h1>

<form>
<label>Enter Neuron URL:</label>
<br>
<input type='text' style='width: 90%' id='url'>
<br>
<label>Use English card names from Yugipedia (for plaintext):</label>
<br>
<input type='checkbox' id='english_names' checked>
<br>
</form>
<button type='button' onclick='updater(false)'>Generate plaintext</button>
<button type='button' onclick='updater(true)'>Generate ydke://</button>
<br>
<textarea style='white-space: pre-wrap; width: 100%; height: 500px;' class='scrollabletextbox' id='result' readonly></textarea>

</body>
</html>
